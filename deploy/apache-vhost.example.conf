# /etc/apache2/conf-available/security.conf (global)
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:443>
    ServerName providence.example.com
    DocumentRoot /var/www/providence/public

    <Directory /var/www/providence/public>
        Options -Indexes -MultiViews -Includes -ExecCGI +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.(git|svn|hg)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "\.(env|sql|log|bak|old|orig|swp|zip|lock|md|dist)$">
        Require all denied
    </FilesMatch>

    # Aucune exécution PHP dans les fichiers téléversés
    <Directory /var/www/providence/public/storage>
        <FilesMatch "\.php[0-9]?$">
            Require all denied
        </FilesMatch>
    </Directory>

    <IfModule mod_headers.c>
        Header always unset X-Powered-By
        Header unset X-Powered-By
    </IfModule>
</VirtualHost>
# Activer : a2enmod headers rewrite

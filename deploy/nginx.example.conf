http {
    server_tokens off;
    # more_clear_headers Server;   # nécessite le module headers-more
}
server {
    listen 443 ssl;
    server_name providence.example.com;
    root /var/www/providence/public;
    index index.php;
    autoindex off;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(env|sql|log|bak|old|orig|swp|zip|lock|md)$ { deny all; return 404; }

    # Seul index.php est exécuté
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
}
